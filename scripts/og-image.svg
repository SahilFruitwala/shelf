<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#09090b"/>
  <!-- soft spotlight -->
  <radialGradient id="glow" cx="28%" cy="30%" r="70%">
    <stop offset="0%" stop-color="#18181b"/>
    <stop offset="100%" stop-color="#09090b"/>
  </radialGradient>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- shelf of spines, mirroring the app illustration -->
  <g transform="translate(90 250)">
    <rect x="0"   y="20"  width="46" height="176" rx="4" fill="#10b981"/>
    <rect x="58"  y="0"   width="52" height="196" rx="4" fill="#fbbf24"/>
    <rect x="122" y="34"  width="42" height="162" rx="4" fill="#38bdf8" transform="rotate(7 143 115)"/>
    <rect x="176" y="12"  width="50" height="184" rx="4" fill="#f472b6"/>
    <rect x="238" y="28"  width="44" height="168" rx="4" fill="#a78bfa"/>
    <rect x="294" y="48"  width="46" height="148" rx="4" fill="#fb923c"/>
    <rect x="-10" y="200" width="360" height="8" rx="4" fill="#3f3f46"/>
  </g>

  <!-- wordmark + tagline -->
  <text x="90" y="120" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="64" font-weight="700" fill="#fafafa">Shelf<tspan fill="#10b981">.</tspan></text>
  <text x="520" y="330" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="52" font-weight="700" fill="#fafafa">Every “we should</text>
  <text x="520" y="392" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="52" font-weight="700" fill="#fafafa">try that” —</text>
  <text x="520" y="454" font-family="'Space Grotesk','Segoe UI',sans-serif" font-size="52" font-weight="700" fill="#10b981">remembered.</text>
  <text x="520" y="510" font-family="'Segoe UI',sans-serif" font-size="26" fill="#a1a1aa">Things to try, watch, read, and visit.</text>
</svg>
